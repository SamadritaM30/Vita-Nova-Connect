debug: false

spring:
  datasource:
    url: jdbc:h2:mem:medical_aid_tracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    store-type: none
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret

server:
  servlet:
    session:
      cookie:
        secure: false
        same-site: Lax

app:
  frontend-url: http://localhost:3000
  cors-allowed-origins: http://localhost:3000

logging:
  level:
    root: WARN
    com.medicalaidtracker: INFO
    org.springframework: WARN
    org.hibernate: WARN
