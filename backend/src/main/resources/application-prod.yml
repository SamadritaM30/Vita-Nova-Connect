spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:None}

management:
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
