version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

